<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Закрывающий тег</title>
    <link rel="stylesheet" href="./fonts/fonts.css" />
    <link rel="stylesheet" href="./styles/variables.css" />
    <link rel="stylesheet" href="./styles/globals.css" />
    <link rel="stylesheet" href="./styles/style.css" />
    <link rel="stylesheet" href="./styles/animations.css" />
    <link rel="stylesheet" href="./styles/components/border.css"/>
    <link rel="stylesheet" href="./styles/components/header.css"/>
  </head>
  <body class="page">
    <header class="header border">
      <h1 class="header__title">
        <span class="header__title-main">&lt;/html&gt;</span>
        <span class="header__title-description">закрывающий тег</span>
      </h1>
    </header>
    <main class="content">
      <section class="sprint">
        <h2 class="sprint__title">Фритрек и нулевой спринт: Подготовка к работе</h2>
        <img
          class="sprint__image"
          src="./images/image-0.png"
          alt="Автолавка с красной крышей, белым кузовом и оранжевым основанием на фиолетовом фоне природы"
        />
        <div class="sprint__container">
          <div class="sprint__description">
            <p class="sprint__description-text">
              Это было самое начало пути. На этом этапе важно было проникнуться основами и настроиться на учёбу.
              И, возможно, подумать, как новые знания могут повлиять на ваше будущее.
            </p>
            <p class="sprint__description-text">Место для ваших воспоминаний о начале обучения.</p>
          </div>
          <div class="sprint__buttons">
            <button class="sprint__button button--icon"></button>
            <button class="sprint__button button">Like</button>
          </div>
        </div>
      </section>
      <button class="more-button button">
        <img class="more-button__icon" src="./svg/floppy.svg" alt="Дискет"/>
        Сохранить на память
      </button>
    </main>
    <script src="./scripts/like.js"></script>
  </body>
</html>
